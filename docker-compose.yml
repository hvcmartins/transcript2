version: "3.9"

services:
  rdtlTranscript:
    build: .
    image: rdtltranscript:latest
    container_name: rdtlTranscript
    restart: unless-stopped

    ports:
      - "6133:6133"

    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=6133
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
      - ENABLE_DIARIZATION=true
      - LOCAL_DEVICE=cpu           # cpu | cuda (no Intel iGPU support in ctranslate2)
      - LOCAL_COMPUTE_TYPE=int8    # int8 = fastest on Intel CPUs with AVX2

    volumes:
      - /mnt/user/appdata/rdtlTranscript/uploads:/app/uploads
      - /mnt/user/appdata/rdtlTranscript/data:/app/data
      # Model weights are large — mount a persistent host path so they
      # survive container rebuilds (small = 466 MB, large-v3 = 3 GB)
      - /mnt/user/appdata/rdtlTranscript/models:/app/models

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:6133/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
