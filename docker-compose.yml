version: "3.9"

services:
  rdtlTranscript:
    build: .
    image: rdtltranscript:latest
    container_name: rdtlTranscript
    restart: unless-stopped

    ports:
      - "6133:6133"

    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=6133
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data

    volumes:
      - /mnt/user/appdata/rdtlTranscript/uploads:/app/uploads
      - /mnt/user/appdata/rdtlTranscript/data:/app/data

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:6133/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
