version: "3.9"

services:
  transcribify:
    build: .
    image: transcribify:latest
    container_name: transcribify
    restart: unless-stopped

    ports:
      - "3005:3000"        # Change 3005 to any free port on your server

    environment:
      - GROQ_API_KEY=gIsuzbde73TXpxumEGJDFkZZ01S77hO5eLB79w/D/9s=
      - PORT=3000
      - HOST=0.0.0.0
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data

    volumes:
      - /mnt/user/appdata/transcribify/uploads:/app/uploads
      - /mnt/user/appdata/transcribify/data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
